apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.snapmaker.updating"
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 1
        versionName "1.3"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH') ?: project.findProperty('KEYSTORE_PATH')
            def keystorePassword = System.getenv('KEYSTORE_PASSWORD') ?: project.findProperty('KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('KEY_ALIAS') ?: project.findProperty('KEY_ALIAS')
            def keyPasswordValue = System.getenv('KEY_PASSWORD') ?: project.findProperty('KEY_PASSWORD')
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword keystorePassword ?: ''
                keyAlias keyAliasValue ?: ''
                keyPassword keyPasswordValue ?: ''
            }
        }
    }
}

dependencies {
    implementation Libs.INSTANCE.appCompat
    implementation Libs.INSTANCE.supportV4
    testImplementation Libs.INSTANCE.junit
}
